name = "shopnix-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
STORE_NAME = "Shopnix"
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "shopnix-db"
database_id = "b962c82e-6ff7-406f-84e7-7052f3ed67a9"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
